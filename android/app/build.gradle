apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    cliFile = file("../../node_modules/react-native/cli.js")
}

/**
 * Set this to true to create four separate APKs instead of one,
 * one for each native architecture. This is useful if you don't
 * use App Bundles (https://developer.android.com/guide/app-bundle/)
 * and want to have separate APKs to upload to the Play Store.
 */
def enableSeparateBuildPerCPUArchitecture = false

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc:+'`
 *
 * The international variant includes ICU i18n library and icu4j data
 * with additional locales.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

/**
 * 获取基于构建日期和时间的版本号
 * 格式：yyMMddHHmm（例如：2511121430 表示 2025年11月12日 14:30）
 * 使用年份后两位，确保版本号在 int 范围内（最大支持到 2099年）
 * 这样每次构建时版本号会自动更新，且可以从版本号看出构建的日期和时间
 * 确保同一天多次构建时版本号也不同，保证唯一性和递增性
 */
def getVersionCode = { ->
    try {
        def date = new Date()
        def formattedDateTime = date.format('yyMMddHHmm')
        def versionCode = Integer.parseInt(formattedDateTime)
        println "构建版本号 (versionCode): ${versionCode} (构建时间: ${date.format('yyyy-MM-dd HH:mm')})"
        return versionCode
    } catch (Exception e) {
        println "警告: 无法生成基于日期时间的版本号，使用默认值 1. 错误: ${e.message}"
        return 1
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion

    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.imageclassifier.v2"
    defaultConfig {
        applicationId "com.imageclassifier.v2"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode getVersionCode()
        versionName "1.0.0"
    }

    splits {
        abi {
            reset()
            enable enableSeparateBuildPerCPUArchitecture
            universalApk false  // If true, also generate a universal APK
            include "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
        }
    }
    // 注释掉签名配置，使用默认配置
    /*
    signingConfigs {
        debug {
            // 使用默认的debug配置，不指定具体的keystore文件
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    */
    buildFeatures {
        buildConfig true
    }
    
    buildTypes {
        debug {
            // 不指定签名配置，使用默认配置
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    
    // 复制 ONNX 模型文件到 assets 目录
    sourceSets {
        main {
            assets {
                srcDirs = ['src/main/assets', '../../public']
            }
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
    
    // 手动添加必要的模块依赖
    implementation project(':react-native-gesture-handler')
    implementation project(':react-native-safe-area-context')
    implementation project(':react-native-screens')
    implementation project(':react-native-async-storage')
    implementation project(':react-native-fast-image')
    implementation project(':react-native-fs')
    implementation project(':react-native-image-picker')
    implementation project(':react-native-image-resizer')
    implementation project(':react-native-reanimated')
    implementation project(':react-native-vector-icons')
    implementation project(':react-native-sqlite-storage')
    implementation project(':onnxruntime-react-native')
    
    // AndroidX ExifInterface - 用于读取图片EXIF信息（MediaStore需要）
    implementation 'androidx.exifinterface:exifinterface:1.3.6'
   
}

