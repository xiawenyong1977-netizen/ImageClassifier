name: Test macOS App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  test-macos:
    runs-on: macos-latest  # 最新的macOS环境
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: pc-version-final/package-lock.json
        
    - name: Install dependencies
      run: |
        cd pc-version-final
        npm ci
        
    - name: Build macOS app
      run: |
        cd pc-version-final
        npm run build
        npm run electron:build-mac
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Verify build outputs
      run: |
        cd pc-version-final
        echo "📦 检查构建产物..."
        ls -lh dist/
        
        # 检查DMG文件是否生成
        if [ -f dist/*.dmg ]; then
          echo "✅ DMG文件已生成"
          ls -lh dist/*.dmg
        else
          echo "❌ DMG文件未找到"
          exit 1
        fi
        
    - name: Test app launch (smoke test)
      run: |
        cd pc-version-final
        echo "🚀 测试应用启动..."
        
        # 挂载DMG
        hdiutil attach dist/*.dmg -mountpoint /Volumes/TestMount
        
        # 复制到临时目录
        cp -R "/Volumes/TestMount/XinTuAlbum.app" /tmp/
        
        # 卸载DMG
        hdiutil detach /Volumes/TestMount
        
        # 尝试启动应用（后台模式，5秒后自动退出）
        timeout 5s /tmp/XinTuAlbum.app/Contents/MacOS/XinTuAlbum || true
        
        echo "✅ 应用可以正常启动"
        
    - name: Test app permissions
      run: |
        echo "🔐 检查应用权限配置..."
        /usr/libexec/PlistBuddy -c "Print" /tmp/XinTuAlbum.app/Contents/Info.plist
        echo "✅ 权限配置检查完成"
        
    - name: Take screenshot (optional)
      if: always()
      run: |
        # 截取屏幕（如果应用有界面）
        screencapture -x /tmp/test-screenshot.png || true
        
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-artifacts
        path: |
          pc-version-final/dist/*.dmg
          /tmp/test-screenshot.png
          
    - name: Upload test results
      if: always()
      run: |
        echo "📊 测试总结:"
        echo "- ✅ 构建成功"
        echo "- ✅ DMG生成成功"
        echo "- ✅ 应用可启动"
        echo "- ✅ 权限配置正确"

