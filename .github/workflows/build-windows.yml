name: Build Windows Desktop App

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: pc-version-final/package-lock.json
        
    - name: Install dependencies
      run: |
        cd pc-version-final
        npm install --legacy-peer-deps
        
    - name: Build Windows app
      run: |
        cd pc-version-final
        npm run build
        npm run electron:build-all -- --publish never
      env:
        CI: true
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-app
        path: |
          pc-version-final/dist/*.exe
          pc-version-final/dist/*.zip
          
    - name: Create Release (if tagged)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          pc-version-final/dist/XinTuAlbum*.exe
          pc-version-final/dist/XinTuAlbum-Setup-*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

