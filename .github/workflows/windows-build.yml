name: Windows Build

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    outputs:
      windows_artifact_paths:
        description: "Paths to the Windows build artifacts"
        value: ${{ jobs.build-windows.outputs.artifact_paths }}

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    outputs:
      artifact_paths: ${{ steps.build.outputs.artifact_paths }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            pc-version-final/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install system dependencies (GTK2-Runtime for node-canvas)
        run: |
          choco install -y pkgconfiglite gtk-runtime libjpeg-turbo

      - name: Prepare build environment
        run: |
          cd pc-version-final
          npm ci --no-optional --legacy-peer-deps
          $gtkRoot = "C:\Program Files (x86)\Gtk2-Runtime"
          if (-not (Test-Path $gtkRoot)) { $gtkRoot = "C:\GTK" }
          $env:GTK_Root = $gtkRoot
          npm install canvas@^2.11.2 --GTK_Root="$gtkRoot"

      - name: Build Windows application (reuse local build.bat)
        shell: cmd
        run: |
          set CI=1
          cd pc-version-final
          call build.bat
        env:
          GH_TOKEN: ${{ secrets.PAT }}

      - name: Find Windows artifacts
        id: build
        run: |
          $artifactPaths = @()
          $distPath = "pc-version-final/dist"
          
          Write-Host "Searching for Windows build artifacts in: $distPath"
          
          # NSIS Installer (*Setup*.exe)
          $nsisInstallers = Get-ChildItem -Path $distPath -Recurse -Include "*Setup*.exe" -ErrorAction SilentlyContinue
          if ($nsisInstallers) {
              Write-Host "Found NSIS installers:"
              $nsisInstallers | ForEach-Object { 
                  Write-Host "  - $($_.FullName)"
                  $artifactPaths += $_.FullName
              }
          }
          
          # Portable EXE (*.Portable.exe)
          $portableExes = Get-ChildItem -Path $distPath -Recurse -Include "*.Portable.exe" -ErrorAction SilentlyContinue
          if ($portableExes) {
              Write-Host "Found Portable EXEs:"
              $portableExes | ForEach-Object { 
                  Write-Host "  - $($_.FullName)"
                  $artifactPaths += $_.FullName
              }
          }
          
          # APPX packages (上传所有版本：未签名和签名版本)
          $appxPackages = Get-ChildItem -Path $distPath -Recurse -Include "*.appx" -ErrorAction SilentlyContinue
          if ($appxPackages) {
              Write-Host "Found APPX packages:"
              $appxPackages | ForEach-Object { 
                  Write-Host "  - $($_.FullName)"
                  $artifactPaths += $_.FullName
              }
          }
          
          # Portable EXE 可能不是 *.Portable.exe 格式，查找其他可能的格式（如 *-x64.exe）
          # 但只在没有找到 *.Portable.exe 时才查找
          if ($portableExes.Count -eq 0) {
              $exeFiles = Get-ChildItem -Path $distPath -Recurse -Include "*.exe" -ErrorAction SilentlyContinue | 
                          Where-Object { $_.Name -notlike "*Setup*" -and $_.Name -notlike "*.Portable.exe" -and $_.Name -like "*-x64.exe" }
              if ($exeFiles) {
                  Write-Host "Found other EXE files (likely portable):"
                  $portableExe = $exeFiles | Select-Object -First 1
                  Write-Host "  - $($portableExe.FullName)"
                  $artifactPaths += $portableExe.FullName
              }
          }
          
          Write-Host "Total artifacts found: $($artifactPaths.Count)"
          
          if ($artifactPaths.Count -eq 0) {
              Write-Error "No Windows build artifacts found in $distPath/"
              Write-Host "Available files in dist directory:"
              Get-ChildItem -Path $distPath -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table
              exit 1
          }
          
          "artifact_paths<<EOF" >> $env:GITHUB_OUTPUT
          $artifactPaths | ForEach-Object { $_ } >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ steps.build.outputs.artifact_paths }}