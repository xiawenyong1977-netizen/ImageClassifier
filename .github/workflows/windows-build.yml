name: Windows Build

# Windows 构建现在生成多个独立的制品，不再使用单一的 artifact_paths
# 制品名称: windows-nsis-installer, windows-portable, windows-appx-unsigned, windows-appx-signed
on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

jobs:
  # 不再使用单一的 artifact_paths，而是生成多个独立的制品
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            pc-version-final/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install system dependencies (GTK2-Runtime for node-canvas)
        run: |
          choco install -y pkgconfiglite gtk-runtime libjpeg-turbo

      - name: Prepare build environment
        run: |
          cd pc-version-final
          npm ci --no-optional --legacy-peer-deps
          $gtkRoot = "C:\Program Files (x86)\Gtk2-Runtime"
          if (-not (Test-Path $gtkRoot)) { $gtkRoot = "C:\GTK" }
          $env:GTK_Root = $gtkRoot
          npm install canvas@^2.11.2 --GTK_Root="$gtkRoot"

      - name: Build Windows application (reuse local build.bat)
        shell: cmd
        run: |
          set CI=1
          cd pc-version-final
          call build.bat
        env:
          GH_TOKEN: ${{ secrets.PAT }}

      - name: Find Windows artifacts
        id: build
        run: |
          $distPath = "pc-version-final/dist"
          
          Write-Host "Searching for Windows build artifacts in: $distPath"
          
          # NSIS Installer (*Setup*.exe)
          $nsisInstallers = Get-ChildItem -Path $distPath -Recurse -Include "*Setup*.exe" -ErrorAction SilentlyContinue
          if ($nsisInstallers) {
              Write-Host "Found NSIS installers:"
              $nsisPaths = @()
              $nsisInstallers | ForEach-Object { 
                  Write-Host "  - $($_.FullName)"
                  $nsisPaths += $_.FullName
              }
              "nsis_paths<<EOF" >> $env:GITHUB_OUTPUT
              $nsisPaths | ForEach-Object { $_ } >> $env:GITHUB_OUTPUT
              "EOF" >> $env:GITHUB_OUTPUT
          }
          
          # Portable EXE - 根据 package.json 和 BUILD_GUIDE.md 确定格式
          # electron-builder portable target 默认格式: ${productName}-${version}-win-${arch}-portable.exe
          # 实际文件名: XinTuAlbum-1.1.2-win-x64-portable.exe
          $portableExes = Get-ChildItem -Path $distPath -Recurse -Include "*.exe" -ErrorAction SilentlyContinue | 
                          Where-Object { 
                              $_.Name -notlike "*Setup*" -and 
                              $_.Name -like "*-win-x64-portable.exe"
                          }
          
          if ($portableExes.Count -eq 0) {
              # 回退：查找其他可能的 portable 格式（兼容不同版本）
              Write-Host "No portable EXE found with standard format (*-win-x64-portable.exe), trying alternative patterns..."
              $portableExes = Get-ChildItem -Path $distPath -Recurse -Include "*.exe" -ErrorAction SilentlyContinue | 
                              Where-Object { 
                                  $_.Name -notlike "*Setup*" -and 
                                  ($_.Name -like "*-portable.exe" -or 
                                   $_.Name -like "*-Portable.exe" -or
                                   $_.Name -like "*Portable*.exe")
                              }
          }
          
          if ($portableExes) {
              Write-Host "Found Portable EXEs:"
              $portablePaths = @()
              $portableExes | ForEach-Object { 
                  Write-Host "  - $($_.FullName)"
                  $portablePaths += $_.FullName
              }
              "portable_paths<<EOF" >> $env:GITHUB_OUTPUT
              $portablePaths | ForEach-Object { $_ } >> $env:GITHUB_OUTPUT
              "EOF" >> $env:GITHUB_OUTPUT
          }
          
          # APPX packages - 分别处理未签名和签名版本
          $appxPackages = Get-ChildItem -Path $distPath -Recurse -Include "*.appx" -ErrorAction SilentlyContinue
          if ($appxPackages) {
              $unsignedAppx = @()
              $signedAppx = @()
              
              $appxPackages | ForEach-Object {
                  if ($_.Name -like "*-signed.appx") {
                      Write-Host "Found signed APPX: $($_.FullName)"
                      $signedAppx += $_.FullName
                  } else {
                      Write-Host "Found unsigned APPX: $($_.FullName)"
                      $unsignedAppx += $_.FullName
                  }
              }
              
              if ($unsignedAppx.Count -gt 0) {
                  "unsigned_appx_paths<<EOF" >> $env:GITHUB_OUTPUT
                  $unsignedAppx | ForEach-Object { $_ } >> $env:GITHUB_OUTPUT
                  "EOF" >> $env:GITHUB_OUTPUT
              }
              
              if ($signedAppx.Count -gt 0) {
                  "signed_appx_paths<<EOF" >> $env:GITHUB_OUTPUT
                  $signedAppx | ForEach-Object { $_ } >> $env:GITHUB_OUTPUT
                  "EOF" >> $env:GITHUB_OUTPUT
              }
          }
          
          # 检查是否至少找到一个类型的制品
          $totalFound = 0
          if ($nsisInstallers) { $totalFound += $nsisInstallers.Count }
          if ($portableExes) { $totalFound += $portableExes.Count }
          if ($appxPackages) { $totalFound += $appxPackages.Count }
          
          Write-Host "Total artifacts found: $totalFound"
          
          if ($totalFound -eq 0) {
              Write-Error "No Windows build artifacts found in $distPath/"
              Write-Host "Available files in dist directory:"
              Get-ChildItem -Path $distPath -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table
              exit 1
          }

      - name: Upload NSIS Installer
        if: steps.build.outputs.nsis_paths != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: ${{ steps.build.outputs.nsis_paths }}

      - name: Upload Portable EXE
        if: steps.build.outputs.portable_paths != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: ${{ steps.build.outputs.portable_paths }}

      - name: Upload Unsigned APPX
        if: steps.build.outputs.unsigned_appx_paths != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-appx-unsigned
          path: ${{ steps.build.outputs.unsigned_appx_paths }}

      - name: Upload Signed APPX
        if: steps.build.outputs.signed_appx_paths != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-appx-signed
          path: ${{ steps.build.outputs.signed_appx_paths }}