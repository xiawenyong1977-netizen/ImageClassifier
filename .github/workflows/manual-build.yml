# 仅用于手动触发。合并到「默认分支」(main/master) 后，在 Actions 左侧点本 workflow 名即可看到 "Run workflow"。
name: Manual Build (Run workflow)

on:
  workflow_dispatch:

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix (all platforms)
        id: set-matrix
        run: echo 'matrix={"platform":["macos", "windows", "android"]}' >> $GITHUB_OUTPUT

  build:
    needs: build-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix) }}
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: ${{ matrix.platform }}
      release_tag: ${{ github.sha }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
