name: Android Build

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    outputs:
      android_artifact_path:
        description: "Path to the Android APK"
        value: ${{ jobs.build-android.outputs.artifact_path }}

jobs:
  build-android:
    name: Build Android APK
    # 使用 Ubuntu：Windows 上 setup-android 下载常被 cancel，Linux 更稳定
    runs-on: ubuntu-latest
    outputs:
      artifact_path: ${{ steps.build.outputs.apk_path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # packages 必须用空格分隔，不能用逗号（逗号会导致 'build-tools;34.0.0,' 找不到）
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platform-tools platforms;android-33 ndk;23.1.7779620'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps
          cd android && ./gradlew --version

      - name: Generate build info
        run: node scripts/generate-build-info.js

      - name: Setup signing (if secrets are configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          chmod 600 android/app/release.keystore

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew clean
          if [ -f "app/release.keystore" ]; then
            # 使用 GitHub Secrets 中的签名配置
            ./gradlew assembleRelease --no-daemon \
              -PMYAPP_RELEASE_STORE_FILE=app/release.keystore \
              -PMYAPP_RELEASE_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              -PMYAPP_RELEASE_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
              -PMYAPP_RELEASE_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"
          else
            # 未配置签名，构建未签名的 APK
            ./gradlew assembleRelease --no-daemon
          fi
        env:
          JAVA_OPTS: '-Xmx2048m'

      - name: Find APK
        id: build
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found in android/app/build/outputs/apk/release"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.build.outputs.apk_path }}