name: Android Build

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    outputs:
      android_artifact_path:
        description: "Path to the Android APK"
        value: ${{ jobs.build-android.outputs.artifact_path }}

jobs:
  build-android:
    name: Build Android APK
    runs-on: windows-latest
    outputs:
      artifact_path: ${{ steps.build.outputs.apk_path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0, platform-tools, platforms;android-33, ndk;23.1.7779620'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && 'C:\\Users\\runneradmin\\.gradle' || '~/.gradle' }}
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --legacy-peer-deps
          Set-Location android
          .\gradlew.bat --version

      - name: Generate build info
        shell: pwsh
        run: node scripts/generate-build-info.js

      - name: Build Android Release APK (reuse local script, skip sign in CI)
        shell: pwsh
        run: |
          Set-Location android
          .\build-and-sign-release.ps1 -SkipSign
        env:
          JAVA_OPTS: '-Xmx2048m'

      - name: Find APK
        id: build
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Path android/app/build/outputs/apk/release -Filter *.apk -Recurse | Select-Object -First 1
          if (-not $apk) {
            Write-Error "No APK found in android/app/build/outputs/apk/release"
            exit 1
          }
          $fullPath = $apk.FullName
          Write-Output "APK_PATH=$fullPath"
          "apk_path=$fullPath" >> $env:GITHUB_OUTPUT

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.build.outputs.apk_path }}