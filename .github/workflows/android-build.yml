name: Android Build

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
    outputs:
      android_artifact_path:
        description: "Path to the Android APK"
        value: ${{ jobs.build-android.outputs.artifact_path }}

jobs:
  build-android:
    name: Build Android APK
    # 使用 Ubuntu：Windows 上 setup-android 下载常被 cancel，Linux 更稳定
    runs-on: ubuntu-latest
    outputs:
      artifact_path: ${{ steps.build.outputs.apk_path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # packages 必须用空格分隔，不能用逗号（逗号会导致 'build-tools;34.0.0,' 找不到）
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platform-tools platforms;android-33 ndk;23.1.7779620'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps
          cd android && ./gradlew --version

      - name: Generate build info
        run: node scripts/generate-build-info.js

      - name: Build unsigned Android Release APK
        run: |
          cd android
          ./gradlew clean
          # 先构建未签名版本
          ./gradlew assembleRelease --no-daemon
          
          # 保存未签名版本到临时目录
          APK_DIR="app/build/outputs/apk/release"
          UNSIGNED_APK=$(find "$APK_DIR" -name "*.apk" -type f | head -n 1)
          if [ -n "$UNSIGNED_APK" ]; then
            mkdir -p ../artifacts
            cp "$UNSIGNED_APK" "../artifacts/app-release-unsigned.apk"
            echo "Unsigned APK saved: ../artifacts/app-release-unsigned.apk"
          fi
        env:
          JAVA_OPTS: '-Xmx2048m'

      - name: Setup signing (if secrets are configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          chmod 600 android/app/release.keystore

      - name: Build signed Android Release APK (if secrets configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          cd android
          # 清理后重新构建签名版本
          ./gradlew clean
          ./gradlew assembleRelease --no-daemon \
            -PMYAPP_RELEASE_STORE_FILE=app/release.keystore \
            -PMYAPP_RELEASE_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PMYAPP_RELEASE_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PMYAPP_RELEASE_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"
          
          # 保存签名版本到临时目录
          APK_DIR="app/build/outputs/apk/release"
          SIGNED_APK=$(find "$APK_DIR" -name "*.apk" -type f | head -n 1)
          if [ -n "$SIGNED_APK" ]; then
            mkdir -p ../artifacts
            cp "$SIGNED_APK" "../artifacts/app-release-signed.apk"
            echo "Signed APK saved: ../artifacts/app-release-signed.apk"
          fi
        env:
          JAVA_OPTS: '-Xmx2048m'

      - name: Find APKs
        id: build
        run: |
          # 检查 artifacts 目录中的 APK 文件
          if [ -f "artifacts/app-release-unsigned.apk" ]; then
            echo "unsigned_apk=artifacts/app-release-unsigned.apk" >> $GITHUB_OUTPUT
            echo "Found unsigned APK"
          fi
          
          if [ -f "artifacts/app-release-signed.apk" ]; then
            echo "signed_apk=artifacts/app-release-signed.apk" >> $GITHUB_OUTPUT
            echo "apk_path=artifacts/app-release-signed.apk" >> $GITHUB_OUTPUT
            echo "Found signed APK"
          elif [ -f "artifacts/app-release-unsigned.apk" ]; then
            echo "apk_path=artifacts/app-release-unsigned.apk" >> $GITHUB_OUTPUT
          else
            echo "No APK found in artifacts directory"
            exit 1
          fi

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-unsigned
          path: ${{ steps.build.outputs.unsigned_apk }}

      - name: Upload signed APK (if available)
        if: ${{ steps.build.outputs.signed_apk != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-signed
          path: ${{ steps.build.outputs.signed_apk }}